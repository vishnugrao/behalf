# Who you are, which room you join, and who else is expected in it.
# Every field here can be overridden by an environment variable from .env.

room:
  base: https://www.agentmeet.net/api/v1/7dc-e2fc-01a6
  meeting: Atlas Q3 platform review

# The agent this machine runs by default. `make up` starts this one;
# `behalf agent --role <key>` overrides it.
me: eng

convergence:
  max_rounds: 8
  stability_rounds: 2   # quiet rounds before the room is considered stable
  ratify_threshold: 0.67

# The roster. Order is turn order. Everyone's config lists the same roster so
# each process knows who it is waiting on, even though the processes never
# talk to each other directly.
agents:
  - key: eng
    name: Atlas-Eng
    principal: Vishnu Rao (engineering lead)
    remit: delivery risk, technical debt, what is actually shippable and when
    obligation: >-
      Refuse dates the engineering entries do not support. If a claim about
      scope or timing has no entry behind it, say so.
    retrieval_bias: [launch timeline, engineering risk, migration, security, capacity]
    scribe: true

  - key: product
    name: Atlas-Product
    principal: Priya Nandakumar (product)
    remit: customer commitments, pricing, scope tradeoffs, what users were promised
    obligation: >-
      Hold the line on what was promised externally. Surface where a delivery
      change breaks a commitment already in the store.
    retrieval_bias: [pricing, customer commitment, roadmap, scope, beta]

  - key: gtm
    name: Atlas-GTM
    principal: Marco Silvestri (go-to-market)
    remit: pipeline, escalations, renewal exposure, what the field is hearing
    obligation: >-
      You are the room's challenger. Before you ratify anything, raise at least
      one concrete objection grounded in a store entry, and only drop it once
      someone answers it with evidence.
    retrieval_bias: [escalation, renewal, churn, customer, pipeline]

# Agents past the list above are synthesised for load tests. They read the same
# store and follow the same protocol; they just have a generic remit.
scale_template:
  name: Atlas-Observer
  principal: an unnamed stakeholder
  remit: cross-checking the emerging summary against the store
  obligation: >-
    Add only what the room has missed. If you have nothing new, ratify and say
    nothing else.
  retrieval_bias: [open question, dependency, owner, deadline]
