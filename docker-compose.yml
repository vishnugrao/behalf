name: behalf

x-common: &common
  build:
    context: .
  image: behalf:local
  env_file:
    - .env
  environment:
    BEHALF_CONFIG: /app/config.yaml
  volumes:
    - ./ledger:/app/ledger
    - ./config.yaml:/app/config.yaml:ro
    - behalf-state:/app/state
    - ./out:/app/out
  init: true

services:
  # One agent per replica. `docker compose up --scale agent=5` puts five
  # process-isolated agents in the room; each picks its identity from its
  # replica ordinal against the roster in config.yaml.
  agent:
    <<: *common
    command: ["agent-by-ordinal"]
    deploy:
      replicas: 3
    restart: "no"
    stop_grace_period: 20s

  # One-shot container for everything that is not an agent:
  #   docker compose run --rm cli search launch date
  #   docker compose run --rm cli note "batch three slipped a week"
  cli:
    <<: *common
    profiles: ["tools"]
    command: ["roster"]
    stdin_open: true
    tty: true

volumes:
  behalf-state:
